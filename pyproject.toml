[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergraph-clustering"
version = "0.1.0"
description = "A hypergraph membrane model for the clustering of PIEZO channels"
requires-python = ">=3.13"

# torch is not listed: install torch 2.10.0 for your CUDA from pytorch.org (see requirements.txt)
dependencies = [
    "lightning==2.6.1",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "wandb==0.25.0",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
packages = [
    "nbcore",
    "nbcore.config",
    "nbcore.callbacks",
    "membrane",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
